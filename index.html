<html lang="en">
<head>

<title>Street Explorer</title>

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Street%20Explorer%22%2C%22short_name%22%3A%22Explorer%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2307080C%22%2C%22theme_color%22%3A%22%2307080C%22%2C%22start_url%22%3A%22.%22%7D">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --panel:rgba(16,18,26,.92); --hair:rgba(255,255,255,.10);
    --text:#F4F5F7; --dim:#9BA0AC; --faint:#5E6472;
    --accent:#4ADE80; --accent-dim:rgba(74,222,128,.16); --route:#FF5A3C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07080C;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #map{position:fixed;inset:0}
  .maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{opacity:.4;font-size:9px}
  #top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:12px 16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .statrow{display:flex;align-items:flex-end}
  #pct{font-size:40px;font-weight:700;letter-spacing:-1.4px;line-height:40px}
  #pctsign{font-size:18px;font-weight:600;color:var(--dim);margin:0 0 4px 2px}
  #statmeta{margin-left:auto;text-align:right}
  #statmeta .a{font-size:13px;font-weight:600}
  #statmeta .b{font-size:11px;color:var(--faint);margin-top:2px}
  #track{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:11px;overflow:hidden}
  #fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .5s}
  #region{font-size:11px;color:var(--faint);margin-top:8px}
  #rec{align-self:flex-start;display:none;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    background:var(--panel);border:1px solid var(--hair);pointer-events:none}
  #rec.on{display:flex}
  #recdot{width:7px;height:7px;border-radius:50%;background:var(--route);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
  #rec span{font-size:11px;color:var(--dim);font-weight:600}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:#10121A;border-top:1px solid var(--hair);
    border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);z-index:5}
  #note{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--dim);line-height:1.4;display:none}
  #planbox{display:none;align-items:center;justify-content:space-between;background:rgba(255,90,60,.1);
    border:1px solid rgba(255,90,60,.22);border-radius:18px;padding:13px 16px;margin-bottom:14px}
  #plankm{font-size:22px;font-weight:700;letter-spacing:-.5px}
  #plansub{font-size:12px;color:var(--dim);margin-top:3px}
  #clearbtn{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim);font-size:12px;font-weight:600;border:0}
  .label{font-size:10px;font-weight:700;letter-spacing:1.1px;color:var(--faint);margin-bottom:10px}
  #chips{display:flex;gap:8px}
  .chip{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid transparent;color:var(--text)}
  .chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .chip .n{font-size:17px;font-weight:700}.chip .u{font-size:10px;color:var(--faint);margin-top:1px}.chip.on .u{color:var(--accent)}
  #recbtn{margin-top:14px;padding:15px 0;border-radius:18px;background:rgba(255,255,255,.08);color:var(--text);font-size:15px;font-weight:700;border:0;width:100%}
  #recbtn.on{background:var(--route);color:#fff}
  #busy{display:none;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--dim)}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--dim);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #tools{position:fixed;right:14px;bottom:250px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .tb{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--hair);color:var(--accent);font-size:18px}
</style>
</head>

</div>

  map.addSource('covered',{type:'geojson',data:coveredGeoJSON()});
  map.addLayer({id:'cov-glow',type:'line',source:'covered',paint:{'line-color':'#4ADE80','line-width':7,'line-opacity':.25,'line-blur':3}});
  map.addLayer({id:'cov',type:'line',source:'covered',paint:{'line-color':'#4ADE80','line-width':3}});
  map.addSource('route',{type:'geojson',data:routeGeoJSON()});
  map.addLayer({id:'route-glow',type:'line',source:'route',paint:{'line-color':'#FF5A3C','line-width':10,'line-opacity':.3,'line-blur':2}});
  map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#FF5A3C','line-width':4}});
  refreshStats();
  locate(true);
});

const gpsMarker=(()=>{const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border-radius:50%;background:#4A9EFF;border:2px solid #fff;box-shadow:0 0 0 6px rgba(74,158,255,.25)';return new maplibregl.Marker({element:el});})();

function refreshCovered(){if(map.getSource('covered'))map.getSource('covered').setData(coveredGeoJSON());}
function refreshRoute(){if(map.getSource('route'))map.getSource('route').setData(routeGeoJSON());}
function totals(){let cov=0;for(const i of covered)cov+=reg.edgeLen(i);return{covKm:cov/1000,totKm:reg.totalKm,pct:reg.totalKm?100*cov/1000/reg.totalKm:0};}
function refreshStats(){const t=totals();$('pct').textContent=t.pct.toFixed(1);$('metaA').textContent=t.covKm.toFixed(1)+' / '+t.totKm.toFixed(0)+' km';$('metaB').textContent=covered.size+' of '+reg.edges.length+' streets';$('fill').style.width=Math.max(1,Math.min(100,t.pct))+'%';$('region').textContent=reg.name;}
function note(m){const n=$('note');n.textContent=m||'';n.style.display=m?'block':'none';}
function busy(m){$('busy').style.display=m?'flex':'none';$('busytext').textContent=m||'';}

const chips=$('chips');
DISTANCES.forEach(d=>{const el=document.createElement('button');el.className='chip';el.innerHTML='<div class="n">'+d+'</div><div class="u">km</div>';el.onclick=()=>makePlan(d,el);chips.appendChild(el);});
function makePlan(d,el){[...chips.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');
  const c=map.getCenter();const start=gps||[c.lat,c.lng];busy('planning '+d+' km');
  setTimeout(()=>{plan=planRoute(reg,start,d,covered);busy('');refreshRoute();
    if(plan.coords.length){$('planbox').style.display='flex';$('plankm').textContent=plan.km+' km';$('plansub').textContent=plan.newKm+' km unexplored · '+plan.pctNew+'% new';
      const b=new maplibregl.LngLatBounds();plan.coords.forEach(([la,lo])=>b.extend([lo,la]));map.fitBounds(b,{padding:{top:150,bottom:320,left:50,right:50}});}
    else note('No unexplored streets within that distance from here.');},20);}
$('clearbtn').onclick=()=>{plan=null;[...chips.children].forEach(c=>c.classList.remove('on'));$('planbox').style.display='none';refreshRoute();};

$('recbtn').onclick=()=>recording?stopRec():startRec();
function startRec(){if(!('geolocation' in navigator)){note('No geolocation on this device.');return;}
  buffer=[];recording=true;$('recbtn').textContent='Stop & save walk';$('recbtn').classList.add('on');$('rec').classList.add('on');note('');
  watchId=navigator.geolocation.watchPosition(p=>{gps=[p.coords.latitude,p.coords.longitude];gpsMarker.setLngLat([gps[1],gps[0]]).addTo(map);if(p.coords.accuracy<=35)buffer.push([gps[0],gps[1]]);},
    e=>note('Location error: '+e.message),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});}
function stopRec(){recording=false;$('recbtn').textContent='Start recording';$('recbtn').classList.remove('on');$('rec').classList.remove('on');if(watchId!=null)navigator.geolocation.clearWatch(watchId);
  if(buffer.length<2){note('No new GPS points recorded.');return;}busy('matching '+buffer.length+' points');
  setTimeout(()=>{const added=matchCoverage(reg,buffer,covered);localStorage.setItem('cov.v1',JSON.stringify([...covered]));busy('');refreshStats();refreshCovered();note(added>0?('+'+added+' new streets uncovered'):'No new streets that time.');},20);}

$('locbtn').onclick=()=>locate(false);
function locate(silent){if(!('geolocation' in navigator)){if(!silent)note('No geolocation on this device.');return;}
  if(!silent)busy('locating');navigator.geolocation.getCurrentPosition(p=>{gps=[p.coords.latitude,p.coords.longitude];busy('');gpsMarker.setLngLat([gps[1],gps[0]]).addTo(map);map.easeTo({center:[gps[1],gps[0]],zoom:Math.max(map.getZoom(),15)});},
    e=>{busy('');if(!silent)note('Location error: '+e.message+' — allow location access, then tap ◎ again.');},{enableHighAccuracy:true,timeout:15000});}
</script>
</body>
